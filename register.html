<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ExploreEase</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">

            <div class="nav-logo-left">
                <a href="index.html" class="left-logo-link">
                    <div class="left-logo-content">
                        <span class="logo-icon-travel">✈️</span>
                        <span class="logo-text-gradient">ExploreEase</span>
                        <span class="logo-icon-compass">🧭</span>
                    </div>
                </a>
            </div>

            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="destinations.html" class="nav-link">Destinations</a>
                <a href="budget-planner.html" class="nav-link">Budget Planner</a>
                <a href="trip-requirements.html" class="nav-link">Checklist</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="login.html" class="nav-link login-btn">Login</a>
            </div>


        </div>
    </nav>

    <section class="register-section">
        <div class="container">
            <div class="register-form-container">
                <h2>Join ExploreEase Today</h2>
                <p class="register-subtitle">Create your account and start exploring India</p>
                <form id="registerForm" class="register-form">
                    <div class="register-form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                        <span class="register-error-message" id="nameError"></span>
                    </div>
                    <div class="register-form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" name="email" placeholder="Enter your email address" required>
                        <span class="register-error-message" id="regEmailError"></span>
                    </div>
                    <div class="register-form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" name="password" placeholder="Create a strong password" required>
                        <span class="register-error-message" id="regPasswordError"></span>
                    </div>
                    <div class="register-form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        <span class="register-error-message" id="confirmPasswordError"></span>
                    </div>
                    <button type="submit" class="register-submit-btn">Create Account</button>
                </form>
                <p class="register-form-footer">Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </section>

    
    <script src="js/main.js"></script>
    <script src="js/forms.js"></script>

</body>

</html>
