<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ExploreEase</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <div class="nav-container">

            <div class="nav-logo-left">
                <a href="index.html" class="left-logo-link">
                    <div class="left-logo-content">
                        <span class="logo-icon-travel">✈️</span>
                        <span class="logo-text-gradient">ExploreEase</span>
                        <span class="logo-icon-compass">🧭</span>
                    </div>
                </a>
            </div>

            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="destinations.html" class="nav-link">Destinations</a>
                <a href="budget-planner.html" class="nav-link">Budget Planner</a>
                <a href="trip-requirements.html" class="nav-link">Checklist</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="login.html" class="nav-link login-btn">Login</a>
            </div>


        </div>
    </nav>

    <section class="login-section">
        <div class="container">
            <div class="login-form-container">
                <h2>Sign In to ExploreEase</h2>
                <form id="loginForm" class="login-form">
                    <div class="login-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        <span class="login-error-message" id="emailError"></span>
                    </div>
                    <div class="login-form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <span class="login-error-message" id="passwordError"></span>
                    </div>
                    <div class="login-checkbox-group">
                        <label for="remember">
                            <input type="checkbox" id="remember" name="remember">
                            Remember me
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="login-submit-btn">Sign In</button>
                </form>
                <p class="login-form-footer">Don't have an account? <a href="register.html">Create one here</a></p>
            </div>
        </div>
    </section>

    
    <script src="js/main.js"></script>
    <script src="js/forms.js"></script>

</body>

</html>
